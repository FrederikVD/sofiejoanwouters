<title>sofie joan</title>
<meta name="description" content="Sofie Joan Wouters, actrice. Waar en wanneer speelt ze?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#ffffff; --contrast:#191919; --primary:#0f6466; --secondary:#fafbf3; --tertiary:#999999;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;min-height:100%;background:var(--base);color:var(--contrast);font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-size:19.3px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--primary);text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:2px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
  .view{display:none} .view.active{display:block}

  /* ---------- HOME: cover ---------- */
  .cover{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#3a4a3f}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  .cover .bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(30px + env(safe-area-inset-top,0px)) 29px 0;font-size:13.9px;line-height:1.6;color:var(--secondary)}
  .cover .bar .title{font-family:Poppins,sans-serif;font-weight:800;text-transform:uppercase;color:var(--secondary);text-decoration:none;letter-spacing:0}
  .cover .bar .nav{color:var(--secondary);text-decoration:none}
  .cover .bar .nav:hover,.cover .bar .title:hover{text-decoration:underline;text-decoration-thickness:.5px}
  .cover .social{position:absolute;left:0;bottom:calc(0px + env(safe-area-inset-bottom,0px));display:flex;gap:16px;padding:0 0 4px 0}
  .social a{display:inline-flex;width:24px;height:24px;color:#fff;text-decoration:none}
  .social svg{width:24px;height:24px;fill:currentColor}

  /* ---------- WAAR: page ---------- */
  .page-header{display:flex;justify-content:space-between;align-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) 29px 0}
  .page-header .title{font-family:Poppins,sans-serif;font-weight:800;text-transform:uppercase;font-size:23.2px;line-height:1;color:var(--contrast);text-decoration:none}
  .page-header .social a{width:16px;height:16px;color:var(--contrast)}
  .page-header .social svg{width:16px;height:16px}
  .page-header .social{gap:16px}
  .entry{max-width:700px;margin:0 auto;padding:0 20px 60px}
  h2{font-family:Poppins,sans-serif;font-weight:600;font-size:38.85px;line-height:1.2;margin:95px 0 30px}

  table{width:100%;border-collapse:collapse;font-size:16.1px;line-height:1.6;table-layout:auto}
  td{padding:8px;vertical-align:top;border:0}
  td.d{white-space:nowrap;width:18%}
  td.s{width:21%}
  td.w{width:36%}
  td.t{width:25%}
  .tm{display:none}
  .year{font-weight:700;margin:40px 0 8px;padding:0 8px}
  .empty{padding:8px}

  .past-toggle{display:inline-block;margin:40px 8px 0;background:var(--contrast);color:var(--base);border:0;font:inherit;font-size:16.1px;padding:12px 22px;cursor:pointer;line-height:1.2}
  .past-toggle:hover{background:var(--primary)}
  #past{display:none} #past.open{display:block}
  .status{font-size:14px;color:var(--tertiary);margin:20px 8px 0}

  @media (max-width:600px){
    .cover .bar{padding-left:20px;padding-right:20px}
    .cover .social{left:0}
    .page-header{padding-left:20px;padding-right:20px}
    h2{font-size:32px;margin-top:60px}
    table{font-size:15px}
    td{padding:8px 6px}
    td.d{width:auto;font-size:14px}
    td.t{display:none}
    .tm{display:block;margin-top:2px}
    td.w{width:auto}
  }
  @media (prefers-reduced-motion:no-preference){ html{scroll-behavior:auto} }
</style>
</head>

const DAGEN = ["zo","ma","di","wo","do","vr","za"];

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(q){ if(c=='"'&&n=='"'){cell+='"';i++;} else if(c=='"'){q=false;} else cell+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(cell);cell="";}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&n=='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x&&x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toDate(s){
  s=(s||"").trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){let y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[2]-1,+m[1]);}
  return null;
}
const pad=n=>String(n).padStart(2,"0");

function rowHTML(r){
  const d=r._d;
  const date=`${DAGEN[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`;
  const show=r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.voorstelling)}</a>`:esc(r.voorstelling);
  const where=[r.zaal,r.stad].filter(Boolean).map(esc).join(", ");
  const type=(r.type||"").toLowerCase(), uur=r.uur?" "+esc(r.uur):"";
  let t="";
  if(type==="school"){ const n=(r.uur||"").match(/^\s*(\d)\s*x/i)?+RegExp.$1:((r.uur||"").split(/\s+en\s+|,/).filter(Boolean).length||1); t=n>1?"schoolvoorstellingen":"schoolvoorstelling"; }
  else if(type==="doorlopend") t="doorlopend"+uur;
  else if(r.tickets) t=`<a href="${esc(r.tickets)}" target="_blank" rel="noopener">${type==="premiere"?"premièretickets":"tickets"}</a>`+uur;
  else t=(type==="premiere"?"première":"")+uur;
  return `<tr><td class="d">${date}</td><td class="s">${show}</td><td class="w">${where}<span class="tm">${t}</span></td><td class="t">${t}</td></tr>`;
}

function render(rows){
  const today=new Date(); today.setHours(0,0,0,0);
  const ok=rows.map(r=>({...r,_d:toDate(r.datum)})).filter(r=>r._d&&(r.status||"ok").toLowerCase()==="ok");
  const up=ok.filter(r=>r._d>=today).sort((a,b)=>a._d-b._d);
  const past=ok.filter(r=>r._d<today).sort((a,b)=>b._d-a._d);
  document.getElementById("upcoming").innerHTML = up.length
    ? `<table>${up.map(rowHTML).join("")}</table>`
    : `<p class="empty">Momenteel geen speeldata gepland.</p>`;
  let html="", cur=null;
  for(const r of past){
    const y=r._d.getFullYear();
    if(y!==cur){ if(cur!==null) html+="</table>"; cur=y; html+=`<p class="year">${y}</p><table>`; }
    html+=rowHTML(r);
  }
  if(cur!==null) html+="</table>";
  document.getElementById("past").innerHTML = html || `<p class="empty">Nog geen voorbije speeldata.</p>`;
}

async function load(){
  if(SHEET_CSV_URL){
    try{
      const res=await fetch(SHEET_CSV_URL,{cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      render(parseCSV(await res.text())); return;
    }catch(e){ document.getElementById("status").textContent="Speellijst kon niet uit de sheet geladen worden, ingebouwde lijst getoond."; }
  }
  render(EMBEDDED);
}

function route(){
  const waar=location.hash==="#waar";
  document.getElementById("view-home").classList.toggle("active",!waar);
  document.getElementById("view-waar").classList.toggle("active",waar);
  document.title=waar?"WAAR & WANNEER – sofie joan":"sofie joan";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.getElementById("toggle").addEventListener("click",function(){
  const p=document.getElementById("past"); const open=p.classList.toggle("open");
  this.setAttribute("aria-expanded",open); this.textContent=open?"Verberg voorbije speeldata":"Speeldata in het verleden?";
});
route(); load();
</script>
